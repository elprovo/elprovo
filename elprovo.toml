version = 2
# Each run has an empty home directory, so go test gets its caches from the
# environment. make replay and the CI workflow set both.
pass_env = ["GOCACHE", "GOMODCACHE"]

[tests]
files = ["**/*_test.go", "**/testdata/**"]
run = "go test -json -count=1 -timeout=5m {packages}"
report = "go-test-json"

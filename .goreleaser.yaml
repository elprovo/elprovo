# Builds the release archives of elprovo for macOS and Linux. Elprovo does not
# support Windows, because it runs commands in Unix process groups.
version: 2

project_name: elprovo

builds:
  - id: elprovo
    main: ./cmd/elprovo
    binary: elprovo
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

# The release notes come from CHANGELOG.md, as the release workflow passes
# them.
changelog:
  disable: true

name: ci

# CI runs only by hand, on GitHub-hosted Linux runners. make check on the
# developer's Mac is the gate, and it covers macOS. The repository is public,
# so its workflows must never run on self-hosted runners: a pull request from
# a fork can change a workflow file.
on:
  workflow_dispatch:
    inputs:
      base:
        description: The commit to replay against, such as origin/main
        required: true
        default: origin/main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make check

  replay:
    # Elprovo replays its own tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build
      - name: Find the merge base
        id: base
        env:
          BASE: ${{ inputs.base }}
        run: echo "sha=$(git merge-base HEAD "$BASE")" >> "$GITHUB_OUTPUT"
      - name: Replay the tests
        uses: ./
        with:
          base: ${{ steps.base.outputs.sha }}
          elprovo: ./bin/elprovo

  action:
    # Replays changes through the action as another project's workflow would:
    # the README's demo, and a repository whose e2e test needs its app
    # running in Docker Compose.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Make the repositories
        id: repos
        run: |
          echo "demo=$(TMPDIR="$RUNNER_TEMP" sh assets/demo-repo.sh)" >> "$GITHUB_OUTPUT"
          echo "app=$(TMPDIR="$RUNNER_TEMP" sh .github/scripts/app-repo.sh)" >> "$GITHUB_OUTPUT"
      - name: Switch the demo to coupon-once
        working-directory: ${{ steps.repos.outputs.demo }}
        run: git switch -q coupon-once
      - name: Replay coupon-once
        id: fix
        uses: ./
        with:
          base: main
          working-directory: ${{ steps.repos.outputs.demo }}
      - name: Check that the test is fixed
        env:
          REPORT: ${{ steps.fix.outputs.report }}
        run: jq -e '.changed | map(select(.name == "TestCouponAppliesOnce" and .verdict == "fixed")) | length == 1' "$REPORT"
      - name: Switch the demo to late-check
        working-directory: ${{ steps.repos.outputs.demo }}
        run: git switch -q late-check
      - name: Replay late-check
        id: late
        uses: ./
        continue-on-error: true
        with:
          base: main
          working-directory: ${{ steps.repos.outputs.demo }}
      - name: Check that the replay fails and the test is not fixed
        env:
          STATUS: ${{ steps.late.outputs.exit-status }}
          REPORT: ${{ steps.late.outputs.report }}
        run: |
          test "$STATUS" = 1
          jq -e '.changed | map(select(.name == "TestCouponAppliesOnce" and .verdict == "not-fixed")) | length == 1' "$REPORT"
      - name: Replay the fix of the app
        id: app
        uses: ./
        with:
          base: main
          working-directory: ${{ steps.repos.outputs.app }}
      - name: Check that the e2e test is fixed
        env:
          REPORT: ${{ steps.app.outputs.report }}
        run: jq -e '.changed | map(select(.name == "TestGreetsByName" and .verdict == "fixed")) | length == 1' "$REPORT"

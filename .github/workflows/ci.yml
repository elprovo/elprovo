name: ci

# CI runs only by hand, on GitHub-hosted Linux runners. make check on the
# developer's Mac is the gate, and it covers macOS. The repository is public,
# so its workflows must never run on self-hosted runners: a pull request from
# a fork can change a workflow file.
on:
  workflow_dispatch:
    inputs:
      base:
        description: The commit to replay against, such as origin/main
        required: true
        default: origin/main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make check

  replay:
    # Elprovo replays its own tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build
      - name: Replay the tests
        shell: bash
        env:
          BASE: ${{ inputs.base }}
        run: |
          set +e
          GOCACHE=$(go env GOCACHE)
          GOMODCACHE=$(go env GOMODCACHE)
          export GOCACHE GOMODCACHE
          ./bin/elprovo replay --base "$(git merge-base HEAD "$BASE")" > replay.txt
          status=$?
          cat replay.txt
          { echo '```'; cat replay.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Keep the report and the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: elprovo-replay
          path: |
            .elprovo/runs/*/report.json
            .elprovo/runs/**/*.log
          if-no-files-found: ignore

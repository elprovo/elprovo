name: ci

# CI runs only by hand while the repository is private: make check on the
# developer's machine is the gate. When the repository goes public, add
# push to main and pull_request to the triggers below.
on:
  workflow_dispatch:
    inputs:
      base:
        description: The commit to replay against, such as origin/main
        required: true
        default: origin/main

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make check

  replay:
    # Elprovo replays its own proofs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build
      - name: Replay the proofs
        shell: bash
        env:
          BASE: ${{ inputs.base }}
        run: |
          set +e
          ./bin/elprovo replay --base "$(git merge-base HEAD "$BASE")" > replay.txt
          status=$?
          cat replay.txt
          { echo '```'; cat replay.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

name: ci

# CI runs only by hand, on GitHub-hosted Linux runners. make check on the
# developer's Mac is the gate, and it covers macOS. The repository is public,
# so its workflows must never run on self-hosted runners: a pull request from
# a fork can change a workflow file.
on:
  workflow_dispatch:
    inputs:
      base:
        description: The commit to replay against, such as origin/main
        required: true
        default: origin/main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make check

  replay:
    # Elprovo replays its own tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build
      - name: Find the merge base
        id: base
        env:
          BASE: ${{ inputs.base }}
        run: echo "commit=$(git merge-base HEAD "$BASE")" >> "$GITHUB_OUTPUT"
      - name: Replay the tests
        uses: ./
        with:
          base: ${{ steps.base.outputs.commit }}
          elprovo: ./bin/elprovo

name: elprovo

# Replays the tests of a pull request on the base commit and on the pull
# request, and posts the verdicts on the pull request. The replay uses elprovo
# built from the base commit, so a pull request cannot change the elprovo that
# judges it. It can change this file, action.yml, its go.mod and its
# elprovo.toml, so review changes to them.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: elprovo-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  replay:
    # A pull request from a fork gets a token that cannot comment, so the
    # replay runs only for branches of this repository.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build elprovo from the base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/elprovo-base" "$BASE_SHA"
          (cd "$RUNNER_TEMP/elprovo-base" && go build -o "$RUNNER_TEMP/elprovo" ./cmd/elprovo)
      - name: Replay the tests of this pull request
        uses: ./
        with:
          elprovo: ${{ runner.temp }}/elprovo
